<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GestureKit 控制中心预览</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1118; --panel:#111b25; --panel2:#152331; --line:#263746; --text:#eef5f2; --muted:#8fa3ad; --accent:#3ed39a; --blue:#6aa8ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 75% 0%,#173c43 0,#0b1118 44%),var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif; }
    .shell { display:flex; min-height:620px; max-width:1120px; margin:32px auto; border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:0 25px 80px #0008; background:#0f1821dd; }
    aside { width:220px; padding:28px 18px 20px; background:#0d151ddd; border-right:1px solid var(--line); display:flex; flex-direction:column; }
    .brand { font-size:13px; letter-spacing:2px; font-weight:800; color:var(--muted); margin:0 12px 28px; }
    nav { display:grid; gap:5px; }
    nav button { border:0; color:var(--muted); background:transparent; text-align:left; border-radius:9px; padding:11px 12px; font:inherit; cursor:pointer; }
    nav button.active, nav button:hover { color:var(--text); background:#2b8c72; }
    .pause { margin-top:auto; border:1px solid #3a4c58; border-radius:9px; background:transparent; color:var(--text); padding:10px; cursor:pointer; }
    main { flex:1; padding:38px 44px; background:linear-gradient(135deg,#15212b99,#0d151d55); }
    h1 { font-size:32px; line-height:1.1; margin:0 0 24px; letter-spacing:-.8px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .card,.operation { background:linear-gradient(145deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:14px; padding:18px; }
    .card { min-height:92px; display:flex; gap:13px; align-items:flex-start; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); margin-top:5px; box-shadow:0 0 15px currentColor; }
    .dot.blue { background:var(--blue); }
    .label { font-weight:700; font-size:15px; }
    .detail { color:var(--muted); margin-top:4px; }
    .operations { display:grid; gap:10px; }
    .operation { display:flex; align-items:center; gap:12px; }
    .operation .meta { margin-left:auto; text-align:right; color:var(--muted); font-size:12px; }
    .operation button { border:1px solid #3d5963; border-radius:7px; color:var(--text); background:#1d3440; padding:7px 10px; cursor:pointer; }
    .hint { color:var(--muted); margin:0 0 16px; }
    @media (max-width:700px) { .shell { margin:0; min-height:100vh; border-radius:0; } aside { width:170px; } main { padding:28px 20px; } .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside><div class="brand">GESTUREKIT</div><nav id="nav"></nav><button class="pause">暂停手势</button></aside>
    <main><h1 id="title">概览</h1><section id="content"></section></main>
  </div>
  <script>
    const pages = ['概览','操作记录','手势预设','Provider','隐私与存储','高级设置'];
    const operations = [
      {state:'已完成', color:'', id:'op-8d2f…91ab', count:4, time:'刚刚'},
      {state:'操作结果暂时无法确认', color:'blue', id:'op-3a10…76c2', count:6, time:'4 分钟前'},
      {state:'失败', color:'', id:'op-11e4…c908', count:3, time:'12 分钟前'}
    ];
    const nav = document.querySelector('#nav'), title = document.querySelector('#title'), content = document.querySelector('#content');
    pages.forEach(page => { const button=document.createElement('button'); button.textContent=page; button.onclick=()=>render(page); nav.append(button); });
    function card(label,detail,blue=false){ return `<div class="card"><span class="dot ${blue?'blue':''}"></span><div><div class="label">${label}</div><div class="detail">${detail}</div></div></div>`; }
    function render(page){
      [...nav.children].forEach(button=>button.classList.toggle('active',button.textContent===page)); title.textContent=page;
      if(page==='概览') content.innerHTML=`<div class="grid">${card('运行状态','手势监听正常')}${card('Provider','Chrome 已认证，动作将定向发送',true)}${card('最近一次操作','已完成 · 4 个事件')}</div>`;
      else if(page==='操作记录') content.innerHTML=`<p class="hint">失败、超时和结果未知的操作会保留完整证据链。</p><div class="operations">${operations.map(o=>`<div class="operation"><span class="dot ${o.color}"></span><div><div class="label">${o.state}</div><div class="detail">${o.id}</div></div><div class="meta">${o.count} 个事件<br>${o.time}</div><button>导出</button></div>`).join('')}</div>`;
      else if(page==='Provider') content.innerHTML=`<div class="grid">${card('Chrome Provider','已认证 · 当前会话正常')}${card('数据边界','不读取网页正文或 Cookie',true)}</div>`;
      else if(page==='隐私与存储') content.innerHTML=`<div class="grid">${card('本地诊断','双重脱敏已启用')}${card('存储预算','最多 50 MB · 默认保留 7 天',true)}</div>`;
      else if(page==='手势预设') content.innerHTML=`${card('当前预设','使用配置文件中的标准手势映射',true)}<p class="hint">V1 使用预设保证行为稳定；后续可扩展换绑和自定义手势。</p>`;
      else content.innerHTML=`${card('诊断记录','失败和结果未知操作会保留证据链')}${card('高级选项','将在不改变手势识别核心的前提下逐步开放',true)}`;
    }
    render('概览');
  </script>
</body>
</html>
