<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Click 二次导航</title></head>
<body>
  <a id="target" href="https://example.com/docs">Open docs</a>
  <script>
    document.getElementById("target")?.addEventListener("click", (event) => {
      event.preventDefault();
      setTimeout(() => { window.location.href = "https://example.com/docs"; }, 0);
    });
  </script>
</body>
</html>
